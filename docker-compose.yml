# Local development stack: the database, the indexer, the MCP API and the
# operator dashboard.
#
#   cp .env.example .env    # then edit it
#   docker compose up --build
#
# The same four images are what get deployed to heyo; see deploy/heyo-deploy.sh.

services:
  meilisearch:
    build:
      context: .
      dockerfile: meilisearch/Dockerfile
    image: crm-meilisearch:dev
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env (see .env.example)}
    volumes:
      - meili-data:/data.ms
    ports:
      - "7700:7700"
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
      args:
        MARKET_FILE: ${MARKET_FILE:-market.example.toml}
    image: crm-bot:dev
    depends_on:
      meilisearch:
        condition: service_healthy
    environment:
      MEILI_URL: http://meilisearch:7700
      # The indexer writes, so it needs the admin key.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?}
      CONTACT_EMAIL: ${CONTACT_EMAIL:?set CONTACT_EMAIL in .env — SEC EDGAR and Wikimedia require a real contact address}
      CRAWL_SEEDS: ${CRAWL_SEEDS:-}
      NEWS_FEEDS: ${NEWS_FEEDS:-}
      SOURCE_INTERVALS: ${SOURCE_INTERVALS:-}
      DISABLED_SOURCES: ${DISABLED_SOURCES:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8081:8081"
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
      args:
        MARKET_FILE: ${MARKET_FILE:-market.example.toml}
    image: crm-mcp:dev
    depends_on:
      meilisearch:
        condition: service_healthy
    environment:
      MEILI_URL: http://meilisearch:7700
      # Scoped keys by design. For local development these fall back to the
      # master key; in production mint real ones — see
      # deploy/create-mcp-keys.sh.
      MEILI_READ_KEY: ${MEILI_READ_KEY:-${MEILI_MASTER_KEY}}
      MEILI_WRITE_KEY: ${MEILI_WRITE_KEY:-${MEILI_MASTER_KEY}}
      MCP_TOKENS: ${MCP_TOKENS:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env — the MCP endpoint refuses to start without one}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8080:8080"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        MARKET_FILE: ${MARKET_FILE:-market.example.toml}
    image: crm-dashboard:dev
    depends_on:
      meilisearch:
        condition: service_healthy
    environment:
      MEILI_URL: http://meilisearch:7700
      # Read-only, but reads every index.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?}
      BOT_HEALTH_URL: http://bot:8081/healthz
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # The operator dashboard — put it behind the load balancer.
      - "8090:8090"
    restart: unless-stopped

volumes:
  meili-data:
